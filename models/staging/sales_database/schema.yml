version: 2

models:
  - name: stg_sales_database__feedback
    description: "This model contains information about feedbacks provided by users on their orders"
    columns:
      - name: feedback_id
        description: "Primary key, unique identifier for each feedback: generated by concatenating feedback_id and order_id."
        tests:
          - unique:
              arguments: {}
          - not_null:
              arguments: {}

      - name: order_id
        description: "Foreign key linking the feedback to the corresponding order."
        tests:
          - relationships:
              name: order_id_foreign_key_in_stg_sales_database__feedback
              arguments:
                to: ref('stg_sales_database__order')
                field: order_id


  - name: stg_sales_database__order
    description: "This model contains information about orders placed by users, including the status of each order."
    columns:
      - name: order_id
        description: "Primary key, unique identifier for each order."
        tests:
          - unique:
              arguments: {}
          - not_null:
              arguments: {}

      - name: order_status
        description: "The current status of the order."
        tests:
          - accepted_values:
              name: accepted_values_order_status
              arguments:
                values:
                  - created
                  - shipped
                  - approved
                  - canceled
                  - invoiced
                  - delivered
